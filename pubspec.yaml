name: order_management
description: Production restaurant QR-based ordering application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing / deep links
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Models / equality
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage & env
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  collection: ^1.19.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.development
    - .env.staging
    - .env.production
